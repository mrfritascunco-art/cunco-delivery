<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cunco Delivery</title><style>body{font:16px system-ui;margin:0;background:#f5f6f2;color:#183626}header{background:#16432d;color:white;padding:25px;text-align:center}main{max-width:700px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #ddd}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ccd5cd;border-radius:9px;font:inherit}button{background:#16432d;color:white;cursor:pointer}button.secondary{background:#e5ece5;color:#183626}.hide{display:none}.item{border-top:1px solid #ddd;padding:12px 0}small{color:#647267}</style></head><body><header><h1>🛵 Cunco Delivery</h1><p>Los negocios de Cunco, más cerca de ti</p></header><main><p id="msg" role="status"></p><section id="guest"><h2 id="authTitle">Iniciar sesión</h2><form id="authForm"><input id="name" class="hide" placeholder="Nombre completo" autocomplete="name"><input id="phone" class="hide" placeholder="Teléfono" autocomplete="tel"><input id="email" type="email" required placeholder="Correo electrónico" autocomplete="email"><input id="password" type="password" minlength="8" required placeholder="Contraseña" autocomplete="current-password"><button id="authSubmit">Ingresar</button></form><button class="secondary" onclick="mode('signup')">Crear cuenta</button><button class="secondary" onclick="mode('login')">Ya tengo cuenta</button></section><div id="private" class="hide"><section><h2>Mi cuenta</h2><p id="who"></p><button class="secondary" onclick="logout()">Cerrar sesión</button></section><section><h2>Inscribir negocio o repartidor</h2><small>La inscripción queda pendiente hasta que el administrador la apruebe.</small><form id="applicationForm"><select id="kind" onchange="changeKind()"><option value="merchant">Registrar mi negocio</option><option value="courier">Quiero repartir</option></select><input id="detail" required placeholder="Nombre de tu negocio"><button>Enviar solicitud</button></form><h3>Mis solicitudes</h3><div id="myApplications"></div></section><section id="admin" class="hide"><h2>Panel de administración</h2><div id="requests"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient('https://nbbwgrpsvhdrkokxirtw.supabase.co','sb_publishable_OrEYCaIT0bTr8BQOIvZ0Gw_m_6U_Sl0');const $=id=>document.getElementById(id);let signup=false;function say(s){$('msg').textContent=s}function mode(m){signup=m==='signup';$('authTitle').textContent=signup?'Crear cuenta':'Iniciar sesión';$('authSubmit').textContent=signup?'Registrarme':'Ingresar';for(const id of ['name','phone'])$(id).classList.toggle('hide',!signup)}function changeKind(){$('detail').placeholder=$('kind').value==='merchant'?'Nombre de tu negocio':'Vehículo (moto, bicicleta, auto...)'}$('authForm').onsubmit=async e=>{e.preventDefault();let email=$('email').value.trim(),password=$('password').value;if(signup){const {data,error}=await sb.auth.signUp({email,password});if(error)return say(error.message);if(data.session){const p=await sb.from('profiles').insert({id:data.user.id,full_name:$('name').value.trim(),phone:$('phone').value.trim()});if(p.error)say('Cuenta creada, pero perfil pendiente: '+p.error.message);else say('Cuenta creada')}else say('Revisa tu correo para confirmar tu cuenta. Después inicia sesión.');await refresh()}else{const {error}=await sb.auth.signInWithPassword({email,password});if(error)return say(error.message);say('');await refresh()}};$('applicationForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await sb.auth.getUser();if(!user)return say('Inicia sesión');const kind=$('kind').value,detail=$('detail').value.trim();if(!detail)return;const payload={user_id:user.id,kind};payload[kind==='merchant'?'business_name':'vehicle_type']=detail;const {error}=await sb.from('applications').insert(payload);say(error?error.message:'Solicitud enviada para revisión');await loadMine()};async function loadMine(){const {data,error}=await sb.from('applications').select('kind,business_name,vehicle_type,status').order('created_at',{ascending:false});$('myApplications').replaceChildren();if(error)return say(error.message);for(const a of data||[]){const p=document.createElement('p');p.textContent=(a.business_name||a.vehicle_type)+' — '+a.status;$('myApplications').append(p)}}async function loadAdmin(){const {data,error}=await sb.from('applications').select('id,user_id,kind,business_name,vehicle_type,status').order('created_at',{ascending:false});$('requests').replaceChildren();if(error)return say(error.message);for(const a of data||[]){const div=document.createElement('div');div.className='item';const p=document.createElement('p');p.textContent=(a.business_name||a.vehicle_type)+' — '+a.kind+' — '+a.status;div.append(p);if(a.status==='pending')for(const [label,status] of [['Aprobar','approved'],['Rechazar','rejected']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{if(!confirm(label+' solicitud?'))return;const {error}=await sb.from('applications').update({status}).eq('id',a.id);say(error?error.message:'Solicitud actualizada');await loadAdmin()};div.append(b)}$('requests').append(div)}if(!data?.length)$('requests').textContent='Sin solicitudes'}async function refresh(){const {data:{user}}=await sb.auth.getUser();$('guest').classList.toggle('hide',!!user);$('private').classList.toggle('hide',!user);if(!user)return;$('who').textContent=user.email;await loadMine();const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();$('admin').classList.toggle('hide',!data);if(data)await loadAdmin()}async function logout(){await sb.auth.signOut();await refresh()}sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();</script></body></html>
