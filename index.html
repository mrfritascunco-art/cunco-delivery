<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cunco Delivery</title><style>body{font:16px system-ui;margin:0;background:#f5f6f2;color:#183626}header{background:#16432d;color:white;padding:25px;text-align:center}main{max-width:700px;margin:auto;padding:20px}section{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #ddd}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border:1px solid #ccd5cd;border-radius:9px;font:inherit}button{background:#16432d;color:white;cursor:pointer}button.secondary{background:#e5ece5;color:#183626}.hide{display:none}.item{border-top:1px solid #ddd;padding:12px 0}small{color:#647267} .product{border:1px solid #e1e7e0;border-radius:10px;padding:12px;margin:10px 0}.price{font-weight:700;color:#16432d}.split{display:flex;gap:8px}.split button{width:auto;flex:1} .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.menu-card{border:1px solid #e1e7e0;border-radius:12px;padding:12px}.menu-card img{width:100%;height:140px;object-fit:cover;border-radius:9px}.category-tabs{display:flex;gap:6px;overflow-x:auto}.category-tabs button{min-width:max-content;width:auto;padding:9px}.cartline{border-bottom:1px solid #ddd;padding:10px 0}textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd5cd;border-radius:9px;font:inherit} </style></head><body><header><h1>🛵 Cunco Delivery</h1><p>Los negocios de Cunco, más cerca de ti</p></header><main><p id="msg" role="status"></p><section><h2>Negocios de Cunco</h2><div id="directory">Cargando negocios...</div></section><section id="shop" class="hide"><button class="secondary" onclick="closeShop()">← Volver a negocios</button><h2 id="shopTitle">Carta</h2><div id="categoryTabs" class="category-tabs"></div><div id="shopProducts" class="menu-grid"></div><h3>🛒 Tu carrito</h3><div id="cartItems"></div><h3 id="cartTotal">Total: $0</h3><small>Carrito de prueba: todavía no se envían pedidos ni se cobran pagos.</small></section><p><small>¿Tienes un negocio? <a href="gestion.html">Entrar a Cunco Delivery Gestión</a></small></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>const sb=supabase.createClient("https://nbbwgrpsvhdrkokxirtw.supabase.co","sb_publishable_OrEYCaIT0bTr8BQOIvZ0Gw_m_6U_Sl0");const $=id=>document.getElementById(id);function say(s){$("msg").textContent=s}const clp=n=>new Intl.NumberFormat("es-CL",{style:"currency",currency:"CLP",maximumFractionDigits:0}).format(n);let shopMerchant=null,shopItems=[],shopExtras={},cart=[],activeCategory='Todos';
const promoNames=/^(MR\\. (CRUNCH|SMASH BOX|TRIO CRUNCH|SOLO|FAMILY BOX|DUO|DUO DELUXE|TRIO MIX|PARTY BOX))$/i;
function categoryFor(p){if(promoNames.test(p.name)||/combo para 2/i.test(p.name))return 'Promociones';if(/papa/i.test(p.name)&&!/burger|smash|whopper/i.test(p.name))return 'Papas';if(/bebida|coca|sprite|fanta|agua/i.test(p.name))return 'Bebidas';if(/empanada|nugget|aro de cebolla/i.test(p.name))return 'Snacks';return 'Hamburguesas'}
async function openShop(id){const {data:merchant,error:me}=await sb.from('merchants').select('id,name').eq('id',id).single();if(me)return say(me.message);const {data:items,error}=await sb.from('products').select('id,name,description,price,image_url,available').eq('merchant_id',id).eq('available',true).order('name');if(error)return say(error.message);shopMerchant=merchant;shopItems=items||[];shopExtras={};cart=[];activeCategory='Todos';$('shopTitle').textContent=merchant.name+' · Carta';$('shop').classList.remove('hide');const ids=shopItems.map(p=>p.id);if(ids.length){const {data:extras, error:exError}=await sb.from('product_extras').select('id,product_id,name,price,available').in('product_id',ids).eq('available',true);if(exError)say('No se pudieron cargar extras: '+exError.message);for(const ex of extras||[])(shopExtras[ex.product_id]??=[]).push(ex)}renderShop();renderCart();$('shop').scrollIntoView({behavior:'smooth'})}
function closeShop(){$('shop').classList.add('hide');shopMerchant=null;cart=[]}
function renderShop(){const categories=['Todos','Promociones','Hamburguesas','Papas','Snacks','Bebidas'].filter(c=>c==='Todos'||shopItems.some(p=>categoryFor(p)===c));$('categoryTabs').replaceChildren();for(const category of categories){const b=document.createElement('button');b.textContent=category;b.className=category===activeCategory?'':'secondary';b.onclick=()=>{activeCategory=category;renderShop()};$('categoryTabs').append(b)}const root=$('shopProducts');root.replaceChildren();for(const p of shopItems.filter(p=>activeCategory==='Todos'||categoryFor(p)===activeCategory)){const card=document.createElement('div');card.className='menu-card';if(p.image_url){const img=document.createElement('img');img.src=p.image_url;img.alt=p.name;img.loading='lazy';img.onerror=()=>img.remove();card.append(img)}const title=document.createElement('h3');title.textContent=p.name;card.append(title);const desc=document.createElement('small');desc.textContent=p.description||'';card.append(desc);const price=document.createElement('p');price.className='price';price.textContent=clp(p.price);card.append(price);const choices=[];for(const ex of shopExtras[p.id]||[]){const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:6px;font-size:14px';const input=document.createElement('input');input.type='checkbox';input.style.width='auto';label.append(input,document.createTextNode(ex.name+' +'+clp(ex.price)));card.append(label);choices.push({input,ex})}const quantity=document.createElement('input');quantity.type='number';quantity.min='1';quantity.max='20';quantity.value='1';quantity.setAttribute('aria-label','Cantidad de '+p.name);card.append(quantity);const add=document.createElement('button');add.textContent='Agregar al carrito';add.onclick=()=>{const qty=Number(quantity.value);if(!Number.isInteger(qty)||qty<1||qty>20)return say('Selecciona entre 1 y 20 unidades');const extras=choices.filter(x=>x.input.checked).map(x=>x.ex);const unit=p.price+extras.reduce((sum,e)=>sum+e.price,0);cart.push({name:p.name,qty,extras,unit});renderCart();say(p.name+' agregado al carrito')};card.append(add);root.append(card)}if(!root.children.length)root.textContent='No hay productos en esta categoría.'}
function renderCart(){const root=$('cartItems');root.replaceChildren();let total=0;cart.forEach((item,i)=>{total+=item.qty*item.unit;const div=document.createElement('div');div.className='cartline';const p=document.createElement('p');p.textContent=item.qty+' × '+item.name+' — '+clp(item.qty*item.unit);div.append(p);if(item.extras.length){const small=document.createElement('small');small.textContent='Extras: '+item.extras.map(e=>e.name).join(', ');div.append(small)}const remove=document.createElement('button');remove.className='secondary';remove.textContent='Quitar';remove.onclick=()=>{cart.splice(i,1);renderCart()};div.append(remove);root.append(div)});if(!cart.length)root.textContent='Tu carrito está vacío.';$('cartTotal').textContent='Total: '+clp(total)}
async function loadDirectory(){const {data,error}=await sb.from('merchants').select('id,name,description,address,opening_hours,is_open').order('name');const root=$('directory');root.replaceChildren();if(error){root.textContent='No se pudo cargar el directorio';return}if(!data?.length){root.textContent='Pronto encontrarás aquí los comercios de Cunco.';return}for(const m of data){const div=document.createElement('div');div.className='product';const h=document.createElement('h3');h.textContent=m.name;div.append(h);const p=document.createElement('p');p.textContent=(m.description||'')+' · '+(m.is_open?'Abierto':'Cerrado');div.append(p);if(m.address){const a=document.createElement('small');a.textContent=m.address;div.append(a)}const btn=document.createElement('button');btn.textContent='Ver carta y armar carrito';btn.onclick=()=>openShop(m.id);div.append(btn);root.append(div)}}
loadDirectory();</script></body></html>
